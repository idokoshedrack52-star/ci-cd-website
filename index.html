<!DOCTYPE html>
<html>

<head>
    <title>My CI/CD Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #0078D4;
            font-size: 50px;
        }

        p {
            font-size: 20px;
            color: #333;
        }

        .container {
            background: white;
            width: 60%;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005A9E;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to My CI/CD Website</h1>

        <p>
            This website is deployed automatically using Azure CI/CD Pipeline.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

    </div>

    <script>
        function showMessage() {
            alert("CI/CD Pipeline is working successfully!");
        }
    </script>

</body>

</html>
